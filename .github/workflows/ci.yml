name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/ClubeDaOnca.Api -c Release
      # Testcontainers usa o Docker já disponível no runner Ubuntu.
      - run: dotnet test tests/ClubeDaOnca.Domain.Tests -c Release
      - run: dotnet test tests/ClubeDaOnca.Api.Tests -c Release

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui
      - run: dotnet build src/ClubeDaOnca.App -c Release -f net10.0-android
      - run: dotnet build src/ClubeDaOnca.App -c Release -f net10.0-windows10.0.19041.0
